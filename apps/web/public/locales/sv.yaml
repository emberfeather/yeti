    showing_all: "Visar alla {total} månader av planen."
    col_month: Månad
    col_total_paid: Totalt Betalt
    col_interest_paid: Ränta Betald
    col_remaining_balance: Återstående Skuld

  disclaimer:
    text: "Detta verktyg är endast avsett för illustrativa och utbildande syften och utgör inte finansiell rådgivning. Rådfråga en certifierad finansiell rådgivare."

  footer:
    powered_by: "Drivs av"

  strategies:
    lowestBalance:
      name: Skuldsnöboll (Snowball)
      tagline: Lägsta saldo först
      description: "Genom att betala av de minsta lånen först bygger du snabbt upp fart och motivation."
      bestFor: "Enklast mentalt och känslomässigt tack vare snabba framsteg."
    highestRate:
      name: Skuldavalanche (Avalanche)
      tagline: Högsta ränta först
      description: "Genom att prioritera skulder med högst ränta minimerar du den totala räntekostnaden."
      bestFor: "Sparar mest pengar för den matematiskt fokuserade."
    balancePaymentRatio:
      name: Kassaflödesoptimerare
      tagline: Lägst saldo-till-betalningskvot
      description: "Fokuserar på skulder som frigör mest månatligt kassaflöde i förhållande till sitt belopp."
      bestFor: "Snabbare skapa luft och utrymme i månadsekonomin."
    balanceRateRatio:
      name: Saldo- och Räntebalans
      tagline: Balanserat tillvägagångssätt
      description: "En hybridmetod som väger samman skuldbelopp och räntekostnad."
      bestFor: "En sund kompromiss mellan återbetalningstakt och räntebesparing."
    highestBalance:
      name: Högsta Saldo Först
      tagline: Största skulderna först
      description: "Angrip den största skulden först för att eliminera den tyngsta grundbördan."
      bestFor: "Den som vill övervinna sitt största hinder direkt."
    lowestRate:
      name: Lägsta Ränta Först
      tagline: Lägst ränta först
      description: "Fokuserar på lån med lägst ränta innan man går vidare till högre."
      bestFor: "Specifika skatte- eller avbetalningspreferenser."
    minimumPayment:
      name: Endast Minsta Betalningar
      tagline: Ingen extra snöbollsbudget
      description: "Simulerar återbetalning med enbart minimibelopp utan snöbollseffekt."
      bestFor: "Jämförelsebas för att utvärdera dina besparingar."
