    duplicates_hidden_other: "{count, integer} strategier doldes eftersom de har samma avbetalningsordning."

  results:
    payoff_date_title: Skuldfri Datum
    total_months: "{months} månader totalt"
    months_saved: "-{months} månader"
    interest_saved_title: Sparad Ränta
    total_interest_paid: "{amount, currency} total ränta betald"

  sequence:
    title: Återbetalningsordning & Snöboll ({strategyName})
    intro: "Följ denna steg-för-steg-ordning. När en skuld är helt betald rullas hela dess månadsbelopp över till nästa mål."
    balance: "Saldo: {balance, currency}"
    rate: "Ränta: {rate}%"
    base_min: "Bas Min: {amount, currency}/mån"
    estimated_payoff_label: Beräknat Klar
    month_sub: "Månad {month}"
