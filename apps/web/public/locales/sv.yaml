config:
  locale: sv-SE
  formats:
    number:
      style: decimal
      minimumFractionDigits: 2
      maximumFractionDigits: 2
    integer:
      style: decimal
      minimumFractionDigits: 0
      maximumFractionDigits: 0
    currency:
      style: currency
      currency: SEK
      minimumFractionDigits: 0
      maximumFractionDigits: 0
    percent:
      style: percent
      minimumFractionDigits: 1
      maximumFractionDigits: 2

strings:
