    storage_save_label: Spara data på denna enhet
    storage_privacy_note: Lagras privat i din webbläsares lokala lagring — skickas aldrig till någon server.
    form:
      name_label: Skuldens Namn
      name_placeholder: "t.ex. Kreditkort"
      balance_label: Skuldbelopp
      rate_label: Ränta
      min_payment_label: Lägsta Månadsbetalning
      cancel: Avbryt
      save: Spara Skuld
      error_required: Vänligen fyll i alla obligatoriska fält.
      error_balance: Skuldbeloppet måste vara ett positivt tal.
      error_rate: Räntan måste vara 0 eller högre.
      error_min_pay: Lägsta månadsbetalning måste vara positiv.
    item:
      rate: "Ränta: {rate}%"
      min_pay: "Minbetalning: {amount, currency}"
      remove_aria: "Ta bort {name}"

  controls:
    extra_payment_title: Extra Månadsbetalning
    extra_payment_sub: Extra snöbollsbudget som läggs till varje månad
    nudge_boost: "Spara {interest, currency} extra i ränta genom att öka betalningen med {bump, currency}{soonerText}."
    nudge_sooner: " (och bli klar {months} månader tidigare)"
    nudge_button: "+{bump, currency}"
    strategy_title: Återbetalningsstrategi
    switch_strategy: "⇄ Byt Strategi"
    close_comparison: "✕ Stäng"

  comparison:
    title: Jämför Alla Strategier
    intro: "Välj en strategi nedan för att simulera effekten på din återbetalningsplan:"
    active_badge: Aktiv
    who_benefits: "Passar bäst för:"
    payoff_time_label: Återbetalningstid
    payoff_time_val: "{months} mån"
    payoff_time_saved: "-{months} mån"
    interest_saved_label: Sparad Ränta
    total_interest_sub: "{amount, currency} total ränta"
